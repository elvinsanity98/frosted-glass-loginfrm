<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* palette */
  --ink: #050403;          /* page black, warm */
  --bone: #F4EFE6;         /* primary text */
  --label: #E6DFD3;        /* field labels */
  --muted: #A8A194;        /* secondary text */
  --faint: #958E82;        /* placeholders, icons */
  --gold: #FFD23F;         /* accent + focus */
  --on-gold: #1C1503;      /* text on the gold button */
  --coral: #FF9580;        /* errors */
  --field: rgba(0, 0, 0, .32);
  --field-line: rgba(255, 255, 255, .09);
  /* type */
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--ink);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  place-items: center;
  padding: 40px 16px;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.backdrop { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ───────── card shell ───────── */
.auth {
  --c0: 64px;            /* resting corner cut; JS reads this */
  --pad: 32px;
  position: relative;
  width: min(440px, 100%);
  scroll-margin-top: 16px;
}
.auth__glass {
  position: absolute; inset: 0; z-index: 0;
  border-radius: 20px;   /* fallback until JS draws the cut corners */
  background:
    linear-gradient(160deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,.015) 62%, rgba(255,200,110,.05) 100%),
    rgba(10, 8, 6, .42);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}
.auth__edge { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.auth__body { position: relative; z-index: 2; padding: 34px var(--pad) 36px; }

/* glass shards that live in the cut corners */
.shard { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; transform-origin: 50% 50%; will-change: transform; }
.shard__glass {
  position: absolute; inset: 0;
  background:
    linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.08) 52%, rgba(255,214,140,.16)),
    rgba(22, 18, 13, .40);
  -webkit-backdrop-filter: blur(8px) saturate(160%) brightness(1.15);
  backdrop-filter: blur(8px) saturate(160%) brightness(1.15);
}
.shard__edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.seam, .glint { position: absolute; pointer-events: none; opacity: 0; }
.seam {
  inset: 2.5px;
  background: linear-gradient(135deg, transparent 48.6%, rgba(255, 214, 110, .95) 50%, transparent 51.4%);
  filter: drop-shadow(0 0 4px rgba(255, 190, 60, .9));
  transition: opacity .5s ease .15s;
}
.auth[data-mode="done"] .seam { opacity: 1; }
.glint {
  inset: -45%;
  background:
    linear-gradient(135deg, transparent 47.5%, rgba(255, 236, 170, .95) 50%, transparent 52.5%),
    radial-gradient(closest-side, rgba(255, 196, 64, .55), rgba(255, 170, 40, .16) 55%, transparent);
  -webkit-mask-image: radial-gradient(closest-side, #000 45%, transparent);
  mask-image: radial-gradient(closest-side, #000 45%, transparent);
}

/* ───────── content ───────── */
.panel__head { padding-left: calc(var(--c0) - var(--pad) + 6px); }
.title {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 31px;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--bone);
  text-wrap: balance;
}
.title:focus { outline: none; }
.accent { color: var(--gold); }
.lede { margin: 8px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); text-wrap: balance; }

.field { margin-top: 18px; }
.panel__head + .field { margin-top: 26px; }
.field > label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--label); }
.control { position: relative; display: flex; align-items: center; }
.control input {
  width: 100%; height: 46px;
  padding: 0 14px 0 42px;
  border: 1px solid var(--field-line);
  border-radius: 10px;
  background: var(--field);
  color: var(--bone);
  font: 500 15px/1.2 var(--text);
  transition: border-color .2s, box-shadow .2s, background-color .2s;
}
.control input.has-reveal { padding-right: 40px; }
.control input::placeholder { color: var(--faint); opacity: 1; }
.control input:hover { border-color: rgba(255,255,255,.16); }
.control input:focus { outline: none; border-color: var(--gold); background: rgba(0,0,0,.42); box-shadow: 0 0 0 3px rgba(255, 210, 63, .16); }
.control input:-webkit-autofill {
  -webkit-text-fill-color: var(--bone);
  -webkit-box-shadow: 0 0 0 40px #16120d inset;
  caret-color: var(--bone);
}
.control__icon { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; transition: color .2s; }
.control:focus-within .control__icon { color: var(--gold); }
.reveal {
  position: absolute; right: 5px;
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--faint);
  cursor: pointer; transition: color .2s;
}
.reveal:hover { color: var(--bone); }
.reveal:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.reveal svg { width: 18px; height: 18px; }
.reveal .i-hide, .reveal[aria-pressed="true"] .i-show { display: none; }
.reveal[aria-pressed="true"] .i-hide { display: block; }

.field.is-invalid input { border-color: rgba(255, 149, 128, .7); }
.field.is-invalid input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255, 149, 128, .16); }
.field.is-invalid .control__icon { color: var(--coral); }
.field__error { margin: 7px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--coral); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair > .field { min-width: 0; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }

.check { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 8px 0; margin: -8px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; }
.check__box {
  flex: none; width: 18px; height: 18px;
  display: grid; place-items: center;
  border: 1.5px solid rgba(255,255,255,.28); border-radius: 5px;
  background: rgba(0,0,0,.25);
  transition: background-color .15s, border-color .15s;
}
.check__box svg { width: 12px; height: 12px; color: var(--on-gold); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.check input:checked + .check__box { background: var(--gold); border-color: var(--gold); }
.check input:checked + .check__box svg { opacity: 1; transform: none; }
.check input:focus-visible + .check__box { outline: 2px solid var(--gold); outline-offset: 2px; }
.check-field { margin-top: 16px; }
.check-field.is-invalid .check__box { border-color: var(--coral); }

.linkish {
  padding: 10px 4px; margin: -10px -4px;
  border: 0; background: none;
  font: inherit; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: color .2s;
}
.linkish:hover { color: var(--bone); }
.linkish--gold { font-weight: 700; color: var(--gold); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.linkish--gold:hover { color: #FFE27A; }
.linkish:focus-visible { outline: 2px solid var(--gold); outline-offset: 0; border-radius: 6px; }
.row .linkish { font-size: 13.5px; }

.btn {
  width: 100%; height: 48px; margin-top: 20px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 10px;
  background: linear-gradient(180deg, #FFE45C 0%, #FFD12E 55%, #F7BE12 100%);
  color: var(--on-gold);
  font: 700 15px/1 var(--text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(140, 90, 0, .35),
    0 10px 28px -10px rgba(255, 190, 20, .7),
    0 2px 6px rgba(0,0,0,.35);
  cursor: pointer;
  transition: transform .15s ease, box-shadow .25s ease;
}
.btn:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(140,90,0,.35), 0 14px 34px -10px rgba(255,190,20,.85), 0 2px 6px rgba(0,0,0,.35); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.btn svg { width: 17px; height: 17px; }
.btn__arrow { transition: transform .2s ease; }
.btn:hover .btn__arrow { transform: translateX(3px); }
.btn .spinner { display: none; }
.btn[aria-busy="true"] { cursor: progress; }
.btn[aria-busy="true"] .btn__arrow { display: none; }
.btn[aria-busy="true"] .spinner { display: block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 16px; font-size: 12.5px; color: var(--faint); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.14)); }
.divider::after { background: linear-gradient(90deg, rgba(255,255,255,.14), transparent); }

.socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.social {
  height: 46px;
  border: 1px solid var(--field-line); border-radius: 10px;
  background: rgba(255,255,255,.035);
  color: var(--bone);
  font: 600 14px/1 var(--text);
  cursor: pointer; transition: background-color .2s, border-color .2s;
}
.social:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
.social:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.status { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
.status:empty { margin: 0; }

.foot { margin: 22px 0 0; font-size: 13.5px; color: var(--muted); text-align: center; }

/* success panel */
.panel--done { text-align: center; padding-top: 2px; }
.emblem-slot { margin: 0 auto 22px; }
.panel--done .lede { max-width: 30ch; margin-inline: auto; overflow-wrap: anywhere; }
.btn-ghost {
  height: 46px; margin-top: 22px; padding: 0 22px;
  border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
  background: rgba(255,255,255,.04);
  color: var(--bone); font: 600 14px/1 var(--text);
  cursor: pointer; transition: background-color .2s, border-color .2s;
}
.btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }
.btn-ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (max-width: 420px) {
  body { padding: 24px 16px; }
  .auth { --c0: 54px; --pad: 22px; }
  .title { font-size: 27px; }
}
@media (max-width: 350px) {
  .pair { grid-template-columns: 1fr; gap: 0; }
}
@media (pointer: coarse) {
  .control input { font-size: 16px; }   /* stops iOS from zooming on focus */
}
</style>
</head>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  const auth = $('#auth');
  const body = $('#authBody');
  const glass = $('.auth__glass');
  const edgeLine = $('.auth__edge .edge-line');
  const edgeRim = $('.auth__edge .edge-rim');
  const shards = $$('.shard');
  const glint = $('.glint');
  const panels = Object.fromEntries($$('.panel').map(p => [p.dataset.panel, p]));
  const forms = { signin: panels.signin, signup: panels.signup, reset: panels.reset };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(pointer: fine)');

  /* ───────── geometry ───────── */
  const r2 = n => Math.round(n * 100) / 100;
  const clamp01 = t => (t < 0 ? 0 : t > 1 ? 1 : t);
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  // Polygon with rounded corners (cubic approximation of each arc).
  function roundedPath(pts, radii) {
    const n = pts.length;
    let d = '';
    for (let i = 0; i < n; i++) {
      const [px, py] = pts[(i + n - 1) % n], [cx, cy] = pts[i], [nx, ny] = pts[(i + 1) % n];
      const l1 = Math.hypot(px - cx, py - cy), l2 = Math.hypot(nx - cx, ny - cy);
      const r = Math.min(radii[i], l1 / 2, l2 / 2);
      const ax = cx + (px - cx) / l1 * r, ay = cy + (py - cy) / l1 * r;
      const bx = cx + (nx - cx) / l2 * r, by = cy + (ny - cy) / l2 * r;
      const k = .55;
      d += `${i ? 'L' : 'M'}${r2(ax)} ${r2(ay)}C${r2(ax + (cx - ax) * k)} ${r2(ay + (cy - ay) * k)} ${r2(bx + (cx - bx) * k)} ${r2(by + (cy - by) * k)} ${r2(bx)} ${r2(by)}`;
    }
    return d + 'Z';
  }
  // Card: rectangle with the top-left and bottom-right corners cut at 45°.
  const cardPath = (w, h, c, i = 0) =>
    roundedPath([[c, i], [w - i, i], [w - i, h - c], [w - c, h - i], [i, h - i], [i, c]], [9, 20, 9, 9, 20, 9]);
  // Shards: the two cut-off corners. Side by side they make a square split on its diagonal.
  const shardPath = (s, which, i = 0) => {
    const j = i * 2.414;
    const pts = which === 0 ? [[i, i], [s - j, i], [i, s - j]] : [[s - i, s - i], [j, s - i], [s - i, j]];
    return roundedPath(pts, [10, 5, 5]);
  };

  const state = {
    mode: 'signin',
    open: 0,               // 0 = corners filled by shards, 1 = corners opened wide
    from: 'rest', to: 'rest', p: 0,   // shard travel between anchors
    pulse: 1,              // "click" when the shards lock
    slot: [0, 0],
    busy: false,
    loading: false,
  };
  let shardSize = 0;

  function geometry() {
    const w = auth.offsetWidth, h = auth.offsetHeight;
    const c0 = parseFloat(getComputedStyle(auth).getPropertyValue('--c0')) || 64;
    return { w, h, c0, s: c0 - 10, c: c0 + c0 * .55 * state.open };
  }
  function anchor(name, g) {
    const { w, h, s } = g;
    if (name === 'center') { const x = w / 2 - s / 2, y = h / 2 - s / 2; return [[x, y], [x, y]]; }
    if (name === 'slot') return [state.slot, state.slot];
    return [[0, 0], [w - s, h - s]];
  }
  function measureSlot() {
    const slot = $('.emblem-slot', panels.done);
    state.slot = [body.offsetLeft + slot.offsetLeft, body.offsetTop + slot.offsetTop];
  }

  function draw() {
    const g = geometry();
    const clip = `path('${cardPath(g.w, g.h, g.c)}')`;
    glass.style.clipPath = clip;
    glass.style.webkitClipPath = clip;
    glass.style.borderRadius = '0';
    const outline = cardPath(g.w, g.h, g.c, .5);
    edgeLine.setAttribute('d', outline);
    edgeRim.setAttribute('d', outline);

    if (g.s !== shardSize) {
      shardSize = g.s;
      $('.emblem-slot', panels.done).style.cssText = `width:${g.s}px;height:${g.s}px`;
      shards.forEach((el, k) => {
        el.style.width = el.style.height = g.s + 'px';
        const cp = `path('${shardPath(g.s, k)}')`;
        const gl = $('.shard__glass', el);
        gl.style.clipPath = cp;
        gl.style.webkitClipPath = cp;
        $('.shard__edge path', el).setAttribute('d', shardPath(g.s, k, .6));
      });
      if (state.mode === 'done') measureSlot();
    }

    const A = anchor(state.from, g), B = anchor(state.to, g);
    shards.forEach((el, k) => {
      const x = A[k][0] + (B[k][0] - A[k][0]) * state.p;
      const y = A[k][1] + (B[k][1] - A[k][1]) * state.p;
      el.style.transform = `translate3d(${r2(x)}px, ${r2(y)}px, 0) scale(${r2(state.pulse * 1000) / 1000})`;
    });
  }

  function tween(duration, onFrame) {
    return new Promise(resolve => {
      const start = performance.now();
      const tick = now => {
        const t = Math.min(duration, now - start);
        onFrame(t);
        t < duration ? requestAnimationFrame(tick) : resolve();
      };
      requestAnimationFrame(tick);
    });
  }
  const lastActive = (segs, t) => segs.reduce((cur, s) => (t >= s.a ? s : cur), segs[0]);

  function flashGlint() {
    if (!glint.animate) return;
    glint.animate(
      [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)', offset: .2 }, { opacity: 0, transform: 'scale(1.5)' }],
      { duration: 440, easing: 'ease-out' }
    );
  }
  function setContent(o) {
    body.style.opacity = o >= 1 ? '' : r2(o);
    body.style.filter = o >= 1 ? '' : `blur(${r2((1 - o) * 8)}px)`;
  }

  /* ───────── the morph: shards fly in, lock, and fly back out ───────── */
  async function morph(to) {
    if (state.busy || to === state.mode || (state.loading && to !== 'done')) return;
    state.busy = true;
    body.inert = true;
    const from = state.mode;
    const fromDone = from === 'done', toDone = to === 'done';
    const h0 = auth.offsetHeight;
    let h1 = h0, swapped = false, glinted = false;
    auth.style.height = h0 + 'px';

    const swap = () => {
      clearErrors(panels[from]);
      panels[from].hidden = true;
      panels[to].hidden = false;
      auth.dataset.mode = to;
      state.mode = to;
      h1 = body.offsetHeight;
      if (toDone) measureSlot();
      swapped = true;
    };

    if (reduceMotion.matches) {
      await tween(140, t => setContent(1 - t / 140));
      swap();
      auth.style.height = '';
      state.from = state.to = toDone ? 'slot' : 'rest';
      state.p = 1; state.open = toDone ? 1 : 0; state.pulse = 1;
      draw();
      await tween(180, t => setContent(t / 180));
      return settle();
    }

    let T, shardSegs, openSegs, out = [0, 240], into, swapAt = 260, hSeg, lockAt = null;
    if (!fromDone) {
      shardSegs = [{ a: 80, b: 540, from: 'rest', to: 'center' },
                   toDone ? { a: 700, b: 1040, from: 'center', to: 'slot' } : { a: 700, b: 1100, from: 'center', to: 'rest' }];
      openSegs = [{ a: 100, b: 520, from: 0, to: 1 }].concat(toDone ? [] : [{ a: 720, b: 1100, from: 1, to: 0 }]);
      hSeg = [260, 700];
      lockAt = 540;
      into = toDone ? [840, 1180] : [780, 1150];
    } else {
      shardSegs = [{ a: 220, b: 760, from: 'slot', to: 'rest' }];
      openSegs = [{ a: 280, b: 760, from: 1, to: 0 }];
      hSeg = [260, 640];
      into = [600, 980];
    }
    T = into[1];

    await tween(T, t => {
      setContent(t < into[0] ? 1 - easeOut(seg(t, out[0], out[1])) : easeOut(seg(t, into[0], into[1])));
      if (!swapped && t >= swapAt) swap();
      if (swapped) auth.style.height = r2(h0 + (h1 - h0) * easeInOut(seg(t, hSeg[0], hSeg[1]))) + 'px';

      const s = lastActive(shardSegs, t);
      state.from = s.from; state.to = s.to; state.p = easeInOut(seg(t, s.a, s.b));
      const o = lastActive(openSegs, t);
      state.open = o.from + (o.to - o.from) * easeInOut(seg(t, o.a, o.b));
      if (lockAt !== null) {
        state.pulse = 1 - .07 * Math.sin(Math.PI * seg(t, lockAt, lockAt + 170));
        if (!glinted && t >= lockAt) { glinted = true; flashGlint(); }
      }
      draw();
    });
    settle();
  }

  function settle() {
    setContent(1);
    auth.style.height = '';
    state.pulse = 1;
    if (state.mode === 'done') { state.from = state.to = 'slot'; measureSlot(); }
    else { state.from = state.to = 'rest'; }
    state.p = 1;
    body.inert = false;
    state.busy = false;
    draw();
    if (auth.getBoundingClientRect().top < 0) {
      auth.scrollIntoView({ block: 'start', behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    }
    const panel = panels[state.mode];
    const firstInput = $('input:not([type=checkbox])', panel);
    if (firstInput && finePointer.matches) firstInput.focus({ preventScroll: true });
    else $('.title', panel).focus({ preventScroll: true });
  }

  // Page-load reveal: the corner pieces start locked together, then split to their corners.
  async function intro() {
    if (reduceMotion.matches) {
      state.from = state.to = 'rest'; state.p = 1; state.open = 0;
      draw(); setContent(1);
      return;
    }
    draw();
    state.busy = true;
    body.inert = true;
    let glinted = false;
    await tween(1080, t => {
      if (!glinted && t >= 140) { glinted = true; flashGlint(); }
      state.pulse = 1 - .07 * Math.sin(Math.PI * seg(t, 140, 310));
      state.from = 'center'; state.to = 'rest'; state.p = easeInOut(seg(t, 380, 900));
      state.open = 1 - easeInOut(seg(t, 400, 900));
      setContent(easeOut(seg(t, 560, 1080)));
      draw();
    });
    state.from = state.to = 'rest'; state.p = 1; state.open = 0; state.pulse = 1;
    setContent(1);
    body.inert = false;
    state.busy = false;
    draw();
  }

  /* ───────── validation ───────── */
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const rules = {
    email: el => EMAIL.test(el.value.trim()) || 'Enter an email address like name@domain.com.',
    password: el => el.value.length > 0 || 'Enter your password.',
    name: el => el.value.trim().length >= 2 || 'Enter your full name.',
    newPassword: el => el.value.length >= 8 || 'Use at least 8 characters.',
    confirm: el => !el.value ? 'Re-enter your password.' : el.value === el.form.elements.password.value || 'Passwords don’t match.',
    terms: el => el.checked || 'Accept the terms to create your account.',
  };
  function setError(el, msg) {
    const field = el.closest('.field, .check-field');
    const out = $('.field__error', field);
    field.classList.toggle('is-invalid', !!msg);
    if (msg) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
    out.textContent = msg || '';
    out.hidden = !msg;
  }
  function validate(form) {
    let firstBad = null;
    $$('[data-rule]', form).forEach(el => {
      const res = rules[el.dataset.rule](el);
      setError(el, res === true ? '' : res);
      if (res !== true && !firstBad) firstBad = el;
    });
    if (firstBad) firstBad.focus();
    return !firstBad;
  }
  function clearErrors(panel) {
    $$('[data-rule]', panel).forEach(el => setError(el, ''));
    $$('.status', panel).forEach(s => (s.textContent = ''));
  }
  Object.values(forms).forEach(form => {
    const clear = e => { if (e.target.dataset.rule && e.target.hasAttribute('aria-invalid')) setError(e.target, ''); };
    form.addEventListener('input', clear);
    form.addEventListener('change', clear);
  });

  /* ───────── submitting ───────── */
  // Stand-in for a real request. Replace with your own auth call (fetch to your API, Firebase, Supabase…).
  const fakeRequest = () => new Promise(resolve => setTimeout(resolve, 1100));

  function setLoading(btn, label) {
    const text = $('.btn__label', btn);
    if (label) { btn.dataset.label = text.textContent; text.textContent = label; }
    else if (btn.dataset.label) text.textContent = btn.dataset.label;
    btn.disabled = !!label;
    btn.setAttribute('aria-busy', label ? 'true' : 'false');
  }
  async function submit(form, busyLabel, onSuccess) {
    if (state.busy || !validate(form)) return;
    const btn = $('.btn', form);
    setLoading(btn, busyLabel);
    state.loading = true;
    try {
      await fakeRequest();
      const done = onSuccess();
      state.loading = false;
      await done;
    } finally {
      state.loading = false;
      setLoading(btn, null);
    }
  }
  function showDone({ lead, accent, text, action, next }) {
    const p = panels.done;
    $('[data-lead]', p).textContent = lead;
    $('[data-accent]', p).textContent = accent;
    $('[data-text]', p).textContent = text;
    const btn = $('[data-action]', p);
    btn.textContent = action;
    btn.onclick = () => morph(next);
    return morph('done');
  }

  const KEY = 'goldglass-login:email';
  const remember = v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} };
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) forms.signin.elements.email.value = saved;
  } catch (e) {}

  forms.signin.addEventListener('submit', e => {
    e.preventDefault();
    const f = forms.signin.elements;
    submit(forms.signin, 'Signing In…', () => {
      const email = f.email.value.trim();
      remember(f.remember.checked ? email : null);
      f.password.value = '';
      return showDone({ lead: 'Signed', accent: 'In', text: `You’re signed in as ${email}.`, action: 'Sign Out', next: 'signin' });
    });
  });
  forms.signup.addEventListener('submit', e => {
    e.preventDefault();
    const f = forms.signup.elements;
    submit(forms.signup, 'Creating Account…', () => {
      const email = f.email.value.trim();
      forms.signin.elements.email.value = email;
      forms.signup.reset();
      return showDone({ lead: 'Account', accent: 'Created', text: `You’re signed in as ${email}.`, action: 'Sign Out', next: 'signin' });
    });
  });
  forms.reset.addEventListener('submit', e => {
    e.preventDefault();
    submit(forms.reset, 'Sending Link…', () => {
      const email = forms.reset.elements.email.value.trim();
      return showDone({ lead: 'Check Your', accent: 'Inbox', text: `We sent a reset link to ${email}.`, action: 'Back to Sign In', next: 'signin' });
    });
  });

  /* ───────── small interactions ───────── */
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (!go) return;
    if (go.dataset.go === 'reset') {
      const typed = forms.signin.elements.email.value.trim();
      if (typed && !forms.reset.elements.email.value) forms.reset.elements.email.value = typed;
    }
    morph(go.dataset.go);
  });

  $$('.reveal').forEach(btn => btn.addEventListener('click', () => {
    const input = $('input', btn.parentElement);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', String(show));
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }));

  $$('.social').forEach(btn => btn.addEventListener('click', () => {
    const status = $('.status', btn.closest('.panel'));
    status.textContent = `${btn.dataset.provider} sign-in isn’t connected yet.`;
    clearTimeout(status._timer);
    status._timer = setTimeout(() => (status.textContent = ''), 3500);
  }));

  new ResizeObserver(() => {
    if (state.busy) return;
    if (state.mode === 'done') measureSlot();
    draw();
  }).observe(auth);

  /* ───────── start ───────── */
  state.from = 'center'; state.to = 'rest'; state.p = 0; state.open = 1;
  setContent(0);
  draw();
  const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 700))]).then(intro);
})();
</script>
</body>
</html>
